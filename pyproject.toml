[project]
name = "example-api"
version = "0.1.0"
description = "example-api — modular-monolith FastAPI service skeleton"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "gunicorn>=21.2,<22.0",
    "sqlalchemy>=1.4,<2.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pyjwt>=2.8,<3.0",
    "python-summer-boot>=1.0.13,<2.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.10",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.1,<5.0",
    "polyfactory>=2.14,<3.0",
    "requests-mock>=1.11,<2.0",
    "moto>=5.0,<6.0",
    "diff-cover>=9.0,<10.0",
    "httpx>=0.27,<1.0",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/env.py", ".claude", "docs"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "UP", "I", "T"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --ignore=tests/stress"
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = ["alembic/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
